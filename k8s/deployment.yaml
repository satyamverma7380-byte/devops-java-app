
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-java-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-java-app
  template:
    metadata:
      labels:
        app: devops-java-app
    spec:
      containers:
        - name: devops-java-app
          image: satyamverma7380/devops-java-app:10
          ports:
            - containerPort: 8080
